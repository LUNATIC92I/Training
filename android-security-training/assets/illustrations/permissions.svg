h="1"/><path d="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">MODÈLE DE PERMISSIONS</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="60" y="70" width="150" height="280" rx="22" fill="#101B2D" stroke="#8995A5" stroke-width="2"/><rect x="113.0" y="80" width="44" height="5" rx="3" fill="#2A3A52"/><rect x="76" y="140" width="118" height="120" rx="12" fill="#15233A"/><text x="135" y="166" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="400" fill="#F5F7FA">Autoriser l'accès</text><text x="135" y="182" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="11" font-weight="400" fill="#F5F7FA">à la position ?</text><rect x="84" y="194" width="102" height="18" rx="6" fill="#2A3A52"/><text x="135" y="207" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9" font-weight="400" fill="#F5F7FA">Seulement cette fois</text><rect x="84" y="216" width="102" height="18" rx="6" fill="#2A3A52"/><text x="135" y="229" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9" font-weight="400" fill="#F5F7FA">Pendant l'utilisation</text><rect x="84" y="238" width="102" height="18" rx="6" fill="#2A3A52"/><text x="135" y="251" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="9" font-weight="400" fill="#F5F7FA">Refuser</text><path d="M215 200L290 200" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><rect x="300" y="80" width="210" height="56" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="405.0" y="106.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Normales</text><text x="405.0" y="125.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">accordées à l'installation</text><rect x="300" y="150" width="210" height="56" rx="10" fill="#101B2D" stroke="#FFB547" stroke-width="1.5"/><text x="405.0" y="176.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Dangereuses</text><text x="405.0" y="195.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">demandées à l'exécution</text><rect x="300" y="220" width="210" height="56" rx="10" fill="#101B2D" stroke="#FF5C6C" stroke-width="1.5"/><text x="405.0" y="246.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Spéciales</text><text x="405.0" y="265.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">réglage dédié</text><rect x="300" y="290" width="210" height="56" rx="10" fill="#101B2D" stroke="#247BFF" stroke-width="1.5"/><text x="405.0" y="316.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Signature</text><text x="405.0" y="335.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">même certificat requis</text><text x="530" y="108" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#F5F7FA">INTERNET, NFC</text><text x="530" y="126" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#8995A5">aucune invite</text><text x="530" y="178" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#F5F7FA">CAMERA, RECORD_AUDIO</text><text x="530" y="196" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#8995A5">position, contacts…</text><text x="530" y="248" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#F5F7FA">Accessibilité, superposition</text><text x="530" y="266" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#8995A5">administrateur, notifications</text><text x="530" y="318" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#F5F7FA">Composants système</text><text x="530" y="336" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#8995A5">applications de confiance</text><text x="60" y="390" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Principe : chaque accès sensible doit être justifié, limité dans le temps et révocable.</text></svg>