<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Contenu et métadonnées</title><desc id="d">Le contenu d'un message est protégé par le chiffrement de bout en bout, mais ses métadonnées restent souvent visibles.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D9FF"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5C6C"/></marker><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#247BFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs><rect width="800" height="440" fill="#0A1120"/><path d="M0 0V440" stroke="#13203A" stroke-width="1"/><path d="M40 0V440" stroke="#13203A" stroke-width="1"/><path d="M80 0V440" stroke="#13203A" stroke-width="1"/><path d="M120 0V440" stroke="#13203A" stroke-width="1"/><path d="M160 0V440" stroke="#13203A" stroke-width="1"/><path d="M200 0V440" stroke="#13203A" stroke-width="1"/><path d="M240 0V440" stroke="#13203A" stroke-width="1"/><path d="M280 0V440" stroke="#13203A" stroke-width="1"/><path d="M320 0V440" stroke="#13203A" stroke-width="1"/><path d="M360 0V440" stroke="#13203A" stroke-width="1"/><path d="M400 0V440" stroke="#13203A" stroke-width="1"/><path d="M440 0V440" stroke="#13203A" stroke-width="1"/><path d="M480 0V440" stroke="#13203A" stroke-width="1"/><path d="M520 0V440" stroke="#13203A" stroke-width="1"/><path d="M560 0V440" stroke="#13203A" stroke-width="1"/><path d="M600 0V440" stroke="#13203A" stroke-width="1"/><path d="M640 0V440" stroke="#13203A" stroke-width="1"/><path d="M680 0V440" stroke="#13203A" stroke-width="1"/><path d="M720 0V440" stroke="#13203A" stroke-width="1"/><path d="M760 0V440" stroke="#13203A" stroke-width="1"/><path d="M0 0H800" stroke="#13203A" stroke-width="1"/><path d="M0 40H800" stroke="#13203A" stroke-width="1"/><path d="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">CONTENU ET MÉTADONNÉES</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="40" y="70" width="320" height="300" rx="14" fill="#101B2D" stroke="#19D49A"/><text x="60" y="100" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#19D49A">CONTENU (protégé par E2EE)</text><text x="60" y="140" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#F5F7FA">« Rendez-vous chez le</text><text x="60" y="162" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="400" fill="#F5F7FA">médecin à 15 h. »</text><rect x="420" y="70" width="340" height="300" rx="14" fill="#101B2D" stroke="#FFB547"/><text x="440" y="100" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#FFB547">MÉTADONNÉES (souvent visibles)</text><text x="440" y="140" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#F5F7FA">› Expéditeur, destinataire</text><text x="440" y="174" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#F5F7FA">› Date et heure d'envoi</text><text x="440" y="208" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#F5F7FA">› Fréquence des échanges</text><text x="440" y="242" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#F5F7FA">› Adresse IP, localisation approx.</text><text x="440" y="276" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#F5F7FA">› Taille des messages</text><text x="440" y="310" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#F5F7FA">› Données EXIF des photos</text><text x="40" y="410" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Les métadonnées révèlent les relations et les habitudes, même sans lire les messages.</text></svg>