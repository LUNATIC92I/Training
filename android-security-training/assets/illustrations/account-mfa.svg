<path d="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">AUTHENTIFICATION MULTIFACTEUR</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="40" y="170" width="160" height="70" rx="10" fill="#101B2D" stroke="#2A3A52" stroke-width="1.5"/><text x="120.0" y="203.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Vous</text><text x="120.0" y="222.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">identifiant</text><rect x="270" y="90" width="200" height="64" rx="10" fill="#101B2D" stroke="#2A3A52" stroke-width="1.5"/><text x="370.0" y="120.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Mot de passe</text><text x="370.0" y="139.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">ce que vous savez</text><rect x="270" y="180" width="200" height="64" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="370.0" y="210.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Clé d'accès / clé FIDO</text><text x="370.0" y="229.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">ce que vous possédez</text><rect x="270" y="270" width="200" height="64" rx="10" fill="#101B2D" stroke="#247BFF" stroke-width="1.5"/><text x="370.0" y="300.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Biométrie locale</text><text x="370.0" y="319.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">ce que vous êtes</text><path d="M202 205L266 122" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M202 205L266 212" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M202 205L266 302" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><rect x="560" y="170" width="200" height="70" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="660.0" y="203.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Compte protégé</text><text x="660.0" y="222.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">au moins 2 facteurs</text><path d="M472 122L556 195" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M472 212L556 205" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M472 302L556 215" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><text x="40" y="390" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Le SMS reste le second facteur le plus faible : préférez une clé d'accès ou une application d'authentification.</text></svg>