="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">RÉAGIR À UNE PERTE OU UN VOL</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="50" y="80" width="130" height="240" rx="22" fill="#101B2D" stroke="#8995A5" stroke-width="2"/><rect x="93.0" y="90" width="44" height="5" rx="3" fill="#2A3A52"/><text x="115" y="210" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#FF5C6C">Perdu</text><rect x="300" y="64" width="300" height="58" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="450.0" y="91.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">1. Localiser</text><text x="450.0" y="110.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">si la localisation est active</text><path d="M184 200L296 93" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 5"/><rect x="300" y="134" width="300" height="58" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="450.0" y="161.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">2. Verrouiller</text><text x="450.0" y="180.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">message, numéro de contact</text><path d="M184 200L296 163" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 5"/><rect x="300" y="204" width="300" height="58" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="450.0" y="231.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">3. Sécuriser les comptes</text><text x="450.0" y="250.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">déconnexion, mots de passe</text><path d="M184 200L296 233" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 5"/><rect x="300" y="274" width="300" height="58" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="450.0" y="301.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">4. Effacer</text><text x="450.0" y="320.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">en dernier recours</text><path d="M184 200L296 303" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 5"/><rect x="300" y="344" width="300" height="58" rx="10" fill="#101B2D" stroke="#247BFF" stroke-width="1.5"/><text x="450.0" y="371.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">5. Signaler</text><text x="450.0" y="390.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">opérateur : blocage SIM / IMEI</text><path d="M184 200L296 373" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)" stroke-dasharray="5 5"/></svg>