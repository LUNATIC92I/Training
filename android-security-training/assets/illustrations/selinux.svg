<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">SELinux</title><desc id="d">Un processus demande l'accès à un objet. La politique SELinux autorise l'accès à ses propres fichiers et refuse l'accès aux fichiers système.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D9FF"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5C6C"/></marker><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#247BFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs><rect width="800" height="440" fill="#0A1120"/><path d="M0 0V440" stroke="#13203A" stroke-width="1"/><path d="M40 0V440" stroke="#13203A" stroke-width="1"/><path d="M80 0V440" stroke="#13203A" stroke-width="1"/><path d="M120 0V440" stroke="#13203A" stroke-width="1"/><path d="M160 0V440" stroke="#13203A" stroke-width="1"/><path d="M200 0V440" stroke="#13203A" stroke-width="1"/><path d="M240 0V440" stroke="#13203A" stroke-width="1"/><path d="M280 0V440" stroke="#13203A" stroke-width="1"/><path d="M320 0V440" stroke="#13203A" stroke-width="1"/><path d="M360 0V440" stroke="#13203A" stroke-width="1"/><path d="M400 0V440" stroke="#13203A" stroke-width="1"/><path d="M440 0V440" stroke="#13203A" stroke-width="1"/><path d="M480 0V440" stroke="#13203A" stroke-width="1"/><path d="M520 0V440" stroke="#13203A" stroke-width="1"/><path d="M560 0V440" stroke="#13203A" stroke-width="1"/><path d="M600 0V440" stroke="#13203A" stroke-width="1"/><path d="M640 0V440" stroke="#13203A" stroke-width="1"/><path d="M680 0V440" stroke="#13203A" stroke-width="1"/><path d="M720 0V440" stroke="#13203A" stroke-width="1"/><path d="M760 0V440" stroke="#13203A" stroke-width="1"/><path d="M0 0H800" stroke="#13203A" stroke-width="1"/><path d="M0 40H800" stroke="#13203A" stroke-width="1"/><path d="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">SELINUX</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="50" y="150" width="170" height="70" rx="10" fill="#101B2D" stroke="#2A3A52" stroke-width="1.5"/><text x="135.0" y="183.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Sujet</text><text x="135.0" y="202.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">processus untrusted_app</text><rect x="315" y="120" width="170" height="130" rx="10" fill="#101B2D" stroke="#FFB547" stroke-width="1.5"/><text x="400.0" y="183.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Politique SELinux</text><text x="400.0" y="202.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">règles allow</text><text x="400" y="222" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#FFB547">mode enforcing</text><rect x="580" y="80" width="170" height="60" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="665.0" y="108.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Objet autorisé</text><text x="665.0" y="127.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">app_data_file</text><rect x="580" y="230" width="170" height="60" rx="10" fill="#101B2D" stroke="#FF5C6C" stroke-width="1.5"/><text x="665.0" y="258.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Objet refusé</text><text x="665.0" y="277.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">system_data_file</text><path d="M222 185L312 185" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M487 160L576 115" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M487 210L576 255" stroke="#FF5C6C" stroke-width="1.8" marker-end="url(#arr)"/><path d="M750 70L756.6666666666666 77.0L770 63.0" fill="none" stroke="#19D49A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M752 212L772 232M772 212L752 232" stroke="#FF5C6C" stroke-width="3" stroke-linecap="round"/><text x="50" y="340" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Contrôle d'accès obligatoire : même un processus compromis ne peut sortir de son domaine.</text><text x="50" y="364" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Tout ce qui n'est pas explicitement autorisé est refusé, puis journalisé (avc: denied).</text></svg>