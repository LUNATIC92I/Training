<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Cycle des correctifs</title><desc id="d">Le trajet d'un correctif de sécurité, de la découverte de la vulnérabilité jusqu'à l'installation sur l'appareil.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D9FF"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5C6C"/></marker><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#247BFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs><rect width="800" height="440" fill="#0A1120"/><path d="M0 0V440" stroke="#13203A" stroke-width="1"/><path d="M40 0V440" stroke="#13203A" stroke-width="1"/><path d="M80 0V440" stroke="#13203A" stroke-width="1"/><path d="M120 0V440" stroke="#13203A" stroke-width="1"/><path d="M160 0V440" stroke="#13203A" stroke-width="1"/><path d="M200 0V440" stroke="#13203A" stroke-width="1"/><path d="M240 0V440" stroke="#13203A" stroke-width="1"/><path d="M280 0V440" stroke="#13203A" stroke-width="1"/><path d="M320 0V440" stroke="#13203A" stroke-width="1"/><path d="M360 0V440" stroke="#13203A" stroke-width="1"/><path d="M400 0V440" stroke="#13203A" stroke-width="1"/><path d="M440 0V440" stroke="#13203A" stroke-width="1"/><path d="M480 0V440" stroke="#13203A" stroke-width="1"/><path d="M520 0V440" stroke="#13203A" stroke-width="1"/><path d="M560 0V440" stroke="#13203A" stroke-width="1"/><path d="M600 0V440" stroke="#13203A" stroke-width="1"/><path d="M640 0V440" stroke="#13203A" stroke-width="1"/><path d="M680 0V440" stroke="#13203A" stroke-width="1"/><path d="M720 0V440" stroke="#13203A" stroke-width="1"/><path d="M760 0V440" stroke="#13203A" stroke-width="1"/><path d="M0 0H800" stroke="#13203A" stroke-width="1"/><path d="M0 40H800" stroke="#13203A" stroke-width="1"/><path d="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">CYCLE DES CORRECTIFS</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="30" y="90" width="220" height="76" rx="10" fill="#101B2D" stroke="#00D9FF" stroke-width="1.5"/><text x="140.0" y="126.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Découverte</text><text x="140.0" y="145.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">chercheur, Google</text><rect x="285" y="90" width="220" height="76" rx="10" fill="#101B2D" stroke="#00D9FF" stroke-width="1.5"/><text x="395.0" y="126.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Correctif</text><text x="395.0" y="145.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">AOSP, puces</text><rect x="540" y="90" width="220" height="76" rx="10" fill="#101B2D" stroke="#00D9FF" stroke-width="1.5"/><text x="650.0" y="126.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Bulletin</text><text x="650.0" y="145.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">mensuel</text><rect x="30" y="250" width="220" height="76" rx="10" fill="#101B2D" stroke="#00D9FF" stroke-width="1.5"/><text x="140.0" y="286.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Fabricant</text><text x="140.0" y="305.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">intégration</text><rect x="285" y="250" width="220" height="76" rx="10" fill="#101B2D" stroke="#00D9FF" stroke-width="1.5"/><text x="395.0" y="286.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Opérateur</text><text x="395.0" y="305.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">selon les cas</text><rect x="540" y="250" width="220" height="76" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="650.0" y="286.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Votre appareil</text><text x="650.0" y="305.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">installation</text><path d="M252 128L282 128" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M507 128L537 128" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M640 168V210H140V246" fill="none" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M252 288L282 288" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M507 288L537 288" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><text x="30" y="380" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Chaque intermédiaire ajoute un délai. Un appareil sans support fabricant ne reçoit plus rien.</text><text x="30" y="404" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#F5F7FA">Niveau de correctif visible dans Paramètres : « Mise à jour de sécurité Android ».</text></svg>