<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Google Play en bac à sable</title><desc id="d">Sur GrapheneOS, le Play Store et les services Google Play s'exécutent comme des applications ordinaires dans un profil, sans privilèges système.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D9FF"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5C6C"/></marker><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#247BFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs><rect width="800" height="440" fill="#0A1120"/><path d="M0 0V440" stroke="#13203A" stroke-width="1"/><path d="M40 0V440" stroke="#13203A" stroke-width="1"/><path d="M80 0V440" stroke="#13203A" stroke-width="1"/><path d="M120 0V440" stroke="#13203A" stroke-width="1"/><path d="M160 0V440" stroke="#13203A" stroke-width="1"/><path d="M200 0V440" stroke="#13203A" stroke-width="1"/><path d="M240 0V440" stroke="#13203A" stroke-width="1"/><path d="M280 0V440" stroke="#13203A" stroke-width="1"/><path d="M320 0V440" stroke="#13203A" stroke-width="1"/><path d="M360 0V440" stroke="#13203A" stroke-width="1"/><path d="M400 0V440" stroke="#13203A" stroke-width="1"/><path d="M440 0V440" stroke="#13203A" stroke-width="1"/><path d="M480 0V440" stroke="#13203A" stroke-width="1"/><path d="M520 0V440" stroke="#13203A" stroke-width="1"/><path d="M560 0V440" stroke="#13203A" stroke-width="1"/><path d="M600 0V440" stroke="#13203A" stroke-width="1"/><path d="M640 0V440" stroke="#13203A" stroke-width="1"/><path d="M680 0V440" stroke="#13203A" stroke-width="1"/><path d="M720 0V440" stroke="#13203A" stroke-width="1"/><path d="M760 0V440" stroke="#13203A" stroke-width="1"/><path d="M0 0H800" stroke="#13203A" stroke-width="1"/><path d="M0 40H800" stroke="#13203A" stroke-width="1"/><path d="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">GOOGLE PLAY EN BAC À SABLE</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="40" y="70" width="460" height="230" rx="16" fill="none" stroke="#00D9FF" stroke-dasharray="7 6" stroke-width="1.6"/><text x="60" y="96" text-anchor="start" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#00D9FF">PROFIL UTILISATEUR · APPLICATIONS ORDINAIRES</text><rect x="60" y="120" width="130" height="64" rx="10" fill="#101B2D" stroke="#2A3A52" stroke-width="1.5"/><text x="125.0" y="157.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Play Store</text><rect x="205" y="120" width="130" height="64" rx="10" fill="#101B2D" stroke="#2A3A52" stroke-width="1.5"/><text x="270.0" y="157.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Play services</text><rect x="350" y="120" width="130" height="64" rx="10" fill="#101B2D" stroke="#2A3A52" stroke-width="1.5"/><text x="415.0" y="157.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Vos applis</text><rect x="60" y="210" width="420" height="64" rx="10" fill="#101B2D" stroke="#2A3A52" stroke-width="1.5"/><text x="270.0" y="247.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#F5F7FA">Mêmes permissions que n'importe quelle application</text><rect x="560" y="70" width="200" height="100" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="660.0" y="118.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Couche de compatibilité</text><text x="660.0" y="137.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">fournie par GrapheneOS</text><rect x="560" y="200" width="200" height="100" rx="10" fill="#101B2D" stroke="#247BFF" stroke-width="1.5"/><text x="660.0" y="248.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Système GrapheneOS</text><text x="660.0" y="267.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">aucun accès privilégié</text><path d="M502 150L556 120" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M660 172L660 196" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><rect x="40" y="330" width="720" height="70" rx="10" fill="#101B2D" stroke="#FFB547" stroke-width="1.5"/><text x="400.0" y="370.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="600" fill="#F5F7FA">Contraste : sur Android standard, les services Google Play sont intégrés au système avec des privilèges étendus.</text></svg>