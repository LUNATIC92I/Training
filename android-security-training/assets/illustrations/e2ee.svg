<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Chiffrement de bout en bout</title><desc id="d">Un message est chiffré sur l'appareil d'Alice, relayé sous forme illisible par le serveur et déchiffré seulement sur l'appareil de Bob.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D9FF"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5C6C"/></marker><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#247BFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs><rect width="800" height="440" fill="#0A1120"/><path d="M0 0V440" stroke="#13203A" stroke-width="1"/><path d="M40 0V440" stroke="#13203A" stroke-width="1"/><path d="M80 0V440" stroke="#13203A" stroke-width="1"/><path d="M120 0V440" stroke="#13203A" stroke-width="1"/><path d="M160 0V440" stroke="#13203A" stroke-width="1"/><path d="M200 0V440" stroke="#13203A" stroke-width="1"/><path d="M240 0V440" stroke="#13203A" stroke-width="1"/><path d="M280 0V440" stroke="#13203A" stroke-width="1"/><path d="M320 0V440" stroke="#13203A" stroke-width="1"/><path d="M360 0V440" stroke="#13203A" stroke-width="1"/><path d="M400 0V440" stroke="#13203A" stroke-width="1"/><path d="M440 0V440" stroke="#13203A" stroke-width="1"/><path d="M480 0V440" stroke="#13203A" stroke-width="1"/><path d="M520 0V440" stroke="#13203A" stroke-width="1"/><path d="M560 0V440" stroke="#13203A" stroke-width="1"/><path d="M600 0V440" stroke="#13203A" stroke-width="1"/><path d="M640 0V440" stroke="#13203A" stroke-width="1"/><path d="M680 0V440" stroke="#13203A" stroke-width="1"/><path d="M720 0V440" stroke="#13203A" stroke-width="1"/><path d="M760 0V440" stroke="#13203A" stroke-width="1"/><path d="M0 0H800" stroke="#13203A" stroke-width="1"/><path d="M0 40H800" stroke="#13203A" stroke-width="1"/><path d="M0 80H800" stroke="#13203A" stroke-width="1"/><path d="M0 120H800" stroke="#13203A" stroke-width="1"/><path d="M0 160H800" stroke="#13203A" stroke-width="1"/><path d="M0 200H800" stroke="#13203A" stroke-width="1"/><path d="M0 240H800" stroke="#13203A" stroke-width="1"/><path d="M0 280H800" stroke="#13203A" stroke-width="1"/><path d="M0 320H800" stroke="#13203A" stroke-width="1"/><path d="M0 360H800" stroke="#13203A" stroke-width="1"/><path d="M0 400H800" stroke="#13203A" stroke-width="1"/><text x="24" y="34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#00D9FF">CHIFFREMENT DE BOUT EN BOUT</text><path d="M24 44H776" stroke="#2A3A52"/><rect x="40" y="160" width="150" height="80" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="115.0" y="198.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Alice</text><text x="115.0" y="217.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">clé privée A</text><rect x="610" y="160" width="150" height="80" rx="10" fill="#101B2D" stroke="#19D49A" stroke-width="1.5"/><text x="685.0" y="198.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Bob</text><text x="685.0" y="217.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">clé privée B</text><rect x="325" y="160" width="150" height="80" rx="10" fill="#101B2D" stroke="#8995A5" stroke-width="1.5"/><text x="400.0" y="198.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Serveur</text><text x="400.0" y="217.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">relaie sans lire</text><path d="M192 200L321 200" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M477 200L606 200" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><text x="256" y="186" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#FFB547">8f3a…c1</text><text x="542" y="186" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#FFB547">8f3a…c1</text><text x="115" y="278" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#F5F7FA">« Bonjour »</text><text x="685" y="278" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#F5F7FA">« Bonjour »</text><text x="400" y="278" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#8995A5">contenu illisible</text><text x="40" y="350" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Le contenu est chiffré sur l'appareil de l'expéditeur et déchiffré uniquement sur celui du destinataire.</text><text x="40" y="374" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFB547">Le serveur peut toutefois voir des métadonnées : qui, quand, combien.</text></svg>