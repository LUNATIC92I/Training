eight="600" fill="#F5F7FA">Service</text><text x="705.0" y="202.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">HTTPS / TLS</text><path d="M162 185L226 185" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M382 185L446 185" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><path d="M582 185L636 185" stroke="#00D9FF" stroke-width="1.8" marker-end="url(#ar)"/><rect x="230" y="280" width="150" height="60" rx="10" fill="#101B2D" stroke="#FF5C6C" stroke-width="1.5"/><text x="305.0" y="308.0" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="15" font-weight="600" fill="#F5F7FA">Attaquant</text><text x="305.0" y="327.0" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8995A5">faux point d'accès</text><path d="M305 278L305 224" stroke="#FF5C6C" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 5"/><path d="M162 120C350 60 520 60 700 146" fill="none" stroke="#19D49A" stroke-width="2.5" stroke-dasharray="2 6"/><text x="430" y="60" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#19D49A">tunnel chiffré de bout en bout (TLS)</text><text x="40" y="380" text-anchor="start" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif" font-size="13" font-weight="400" fill="#8995A5">Le chiffrement TLS protège le contenu ; le DNS chiffré masque les noms de domaine au réseau local.</text></svg>