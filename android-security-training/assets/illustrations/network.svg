<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Chemin réseau</title><desc id="d">Le trajet des données d'un smartphone vers un service en ligne via un Wi-Fi public, avec les protections TLS et DNS chiffré.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#00D9FF"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FF5C6C"/></marker><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#247BFF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs><rect width="800" height="440" fill="#0A1120"/><path d="M0 0V440" stroke="#13203A" stroke-width="1"/><path d="M40 0V440" stroke="#13203A" stroke-width="1"/><path d="M80 0V440" stroke="#13203A" stroke-width="1"/><path d="M120 0V440" stroke="#13203A" stroke-width="1"/><path d="M160 0V440" stroke="#13203A" stroke-width="1"/><path d="M200 0V440" stroke="#13203A" stroke-width="1"/><path d="M240 0V440" stroke="#13203A" stroke-width="1"/><path d="M280 0V440" stroke="#13203A" stroke-width="1"/><path d="M320 0V440" stroke="#13203A" stroke-width="1"/><path d="M360 0V440" stroke="#13203A" stroke-width="1"/><path d="M400 0V440" stroke="#13203A" stroke-width="1"/><path d="M440 0V440" stroke="#13203A" stroke-width="1"/><path d="M480 0V440" stroke="#13203A" stroke-width="1"/><path d="M520 0V440" stroke="#13203A" stroke-width="1"/><path d="M560 0V440" stroke="#13203A" stroke-width="1"/><path d="M600 0V440" stroke="#13203A" stroke-width="1"/><path d="M640 0V440" stroke="#13203A" stroke-width="1"/><path d="M680 0V440" stroke="#13203A" stroke-width="1"/><path d="M720 0V440" stroke="#13203A" stroke-width="1"/><path d="M760 0V440" stroke="#13203A" stroke-width="1"/><path d="M0 0H800" stroke="#13203A" stroke-width="1"/><path d="M0 40H800" stroke="#1