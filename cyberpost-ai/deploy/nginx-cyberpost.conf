# Nginx : HTTPS obligatoire, PHP-FPM 8.3. Certificat Let's Encrypt via certbot.
server {
    listen 80;
    server_name cyberpost.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cyberpost.example.com;
    root /var/www/cyberpost/backend/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/cyberpost.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberpost.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 180s; # génération à la demande
    }

    location ~ /\.(?!well-known) { deny all; }
}
