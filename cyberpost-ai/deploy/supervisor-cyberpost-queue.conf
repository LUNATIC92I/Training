; Facultatif : traitement de la file d'attente Laravel (QUEUE_CONNECTION=database).
; Les générations à la demande s'exécutent après la réponse HTTP et ne nécessitent pas ce processus ;
; il reste utile si vous ajoutez d'autres tâches asynchrones.
[program:cyberpost-queue]
command=php /var/www/cyberpost/backend/artisan queue:work --sleep=3 --tries=1 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopwaitsecs=620
stdout_logfile=/var/www/cyberpost/backend/storage/logs/queue.log
